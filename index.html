<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Sentinel // 24/7 Execution Core</title>
  <style>
    :root {
      --bg-dark: #070a10;
      --card-bg: rgba(13, 20, 33, 0.9);
      --border-color: #1a2638;
      --accent-neon: #00ff66;
      --accent-cyan: #00e5ff;
      --accent-red: #ff3366;
      --accent-amber: #ffb703;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 0);
      background-size: 20px 20px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Server Bar */
    header {
      background: rgba(7, 10, 16, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .status-pulse {
      width: 10px;
      height: 10px;
      background: var(--accent-neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-neon);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* Drawer Sidebar */
    .menu-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .menu-btn:active {
      transform: scale(0.92);
      border-color: var(--accent-cyan);
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: #090e17;
      border-left: 1px solid var(--border-color);
      z-index: 100;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.open {
      transform: translateX(-320px);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-item {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }

    .sidebar-item:hover, .sidebar-item.active {
      background: rgba(0, 229, 255, 0.08);
      color: var(--accent-cyan);
      border-color: rgba(0, 229, 255, 0.25);
    }

    /* Views Scaffolding */
    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 14px;
    }

    .view-section {
      display: none;
      animation: fadeIn 0.25s ease forwards;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Terminal Cards */
    .terminal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 0.95rem;
      color: var(--accent-cyan);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #05080f;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
    }

    .btn-container {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #000;
    }

    .btn-danger {
      background: transparent;
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn-danger:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .btn-secondary {
      background: #1e293b;
      color: var(--text-main);
    }

    /* Client Detailed Cards */
    .client-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .client-node {
      background: #080d16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .client-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .badge-ok {
      background: rgba(0, 255, 102, 0.12);
      color: var(--accent-neon);
      border: 1px solid var(--accent-neon);
    }

    .badge-err {
      background: rgba(255, 51, 102, 0.15);
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
    }

    .badge-wait {
      background: rgba(255, 183, 3, 0.12);
      color: var(--accent-amber);
      border: 1px solid var(--accent-amber);
    }

    .detail-box {
      background: #04060a;
      border: 1px solid #141c2b;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.72rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      color: var(--text-muted);
    }

    .detail-val {
      color: var(--text-main);
      text-align: right;
      word-break: break-all;
    }

    .error-console {
      background: rgba(255, 51, 102, 0.08);
      border: 1px dashed var(--accent-red);
      border-radius: 4px;
      padding: 6px 8px;
      color: #fca5a5;
      font-size: 0.72rem;
      line-height: 1.3;
      margin-top: 2px;
    }

    /* Realtime Terminal */
    .log-terminal {
      background: #030509;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      max-height: 380px;
      overflow-y: auto;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .log-line {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding-bottom: 3px;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <span class="status-pulse"></span>
      <span>SENTINEL // 24/7 AUTO-PURGE</span>
    </div>
    <button class="menu-btn" onclick="toggleSidebar(true)">⚡ ☰</button>
  </header>

  <!-- Navigation Drawer -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3 style="color: var(--accent-cyan); font-size: 0.9rem;">⚡ MENU MATRIX</h3>
      <button class="menu-btn" onclick="toggleSidebar(false)">✕</button>
    </div>
    <ul class="sidebar-menu">
      <li class="sidebar-item active" onclick="switchDashboard('view-add')">
        <span>➕</span> Register Client
      </li>
      <li class="sidebar-item" onclick="switchDashboard('view-clients')">
        <span>🖥️</span> Node Fleet (<span id="menu-client-count">0</span>)
      </li>
      <li class="sidebar-item" onclick="switchDashboard('view-logs')">
        <span>📜</span> Audit Terminal
      </li>
      <li class="sidebar-item" onclick="switchDashboard('view-status')">
        <span>📊</span> Diagnostics & Metrics
      </li>
    </ul>
  </aside>

  <!-- Viewports -->
  <main>
    
    <!-- View 1: Register Client -->
    <section id="view-add" class="view-section active">
      <div class="terminal-card">
        <h2 class="card-title" id="form-header"><span>➕</span> Register New Firebase Database</h2>
        <input type="hidden" id="edit-index" value="-1">
        
        <div class="field-group">
          <label>Client / Identifier Name</label>
          <input type="text" id="client-name" placeholder="Client Enterprise Node 01">
        </div>

        <div class="field-group">
          <label>Firebase Database Endpoint URL</label>
          <input type="text" id="client-url" placeholder="https://database-name.firebaseio.com">
        </div>

        <div class="field-group">
          <label>Database Secret / Master Auth Key</label>
          <input type="text" id="client-key" placeholder="Optional if Rules are open (.read/.write: true)">
        </div>

        <div class="btn-container">
          <button class="btn btn-primary" id="btn-save" onclick="handleSaveClient()">
            <span>💾</span> Store Client
          </button>
          <button class="btn btn-secondary" id="btn-cancel" style="display:none;" onclick="cancelEdit()">
            <span>🛑</span> Cancel
          </button>
        </div>
      </div>
    </section>

    <!-- View 2: Detailed Client Fleet -->
    <section id="view-clients" class="view-section">
      <div class="terminal-card">
        <h2 class="card-title">
          <span>🖥️</span> Monitored Targets (<span id="nodes-count-display">0</span>)
        </h2>
        <div class="client-grid" id="client-cards-container"></div>
      </div>
    </section>

    <!-- View 3: Execution Terminal -->
    <section id="view-logs" class="view-section">
      <div class="terminal-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 class="card-title" style="margin: 0;"><span>📜</span> Purge Execution Stream</h2>
          <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.72rem;" onclick="clearLogs()">
            <span>🗑️</span> Clear Terminal
          </button>
        </div>
        <div class="log-terminal" id="terminal-feed"></div>
      </div>
    </section>

    <!-- View 4: System Metrics -->
    <section id="view-status" class="view-section">
      <div class="terminal-card">
        <h2 class="card-title"><span>📊</span> Execution Diagnostics</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 10px;">
          <div style="background: #04060a; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div style="font-size: 0.7rem; color: var(--text-muted);">FLEET COUNT</div>
            <div style="font-size: 1.4rem; color: var(--accent-cyan); font-weight: bold;" id="metric-clients">0</div>
          </div>
          <div style="background: #04060a; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div style="font-size: 0.7rem; color: var(--text-muted);">DATA PURGES</div>
            <div style="font-size: 1.4rem; color: var(--accent-neon); font-weight: bold;" id="metric-purges">0</div>
          </div>
          <div style="background: #04060a; padding: 12px; border-radius: 6px; border: 1px solid var(--border-color);">
            <div style="font-size: 0.7rem; color: var(--text-muted);">ACTIVE ERRORS</div>
            <div style="font-size: 1.4rem; color: var(--accent-red); font-weight: bold;" id="metric-errors">0</div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    /* Audio Tone Generator */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 650) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch(e) {}
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('button, .sidebar-item')) playBeep();
    });

    /* State Management */
    let clients = JSON.parse(localStorage.getItem('fbs_clients')) || [];
    let logs = JSON.parse(localStorage.getItem('fbs_logs')) || [];
    let totalPurges = parseInt(localStorage.getItem('fbs_purges')) || 0;

    function saveState() {
      localStorage.setItem('fbs_clients', JSON.stringify(clients));
      localStorage.setItem('fbs_logs', JSON.stringify(logs));
      localStorage.setItem('fbs_purges', totalPurges);
    }

    /* Navigation */
    function toggleSidebar(open) {
      document.getElementById('sidebar').classList.toggle('open', open);
      document.getElementById('overlay').classList.toggle('open', open);
    }

    function switchDashboard(viewId) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');

      document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
        if (item.getAttribute('onclick').includes(viewId)) item.classList.add('active');
      });
      toggleSidebar(false);
    }

    /* CRUD Operations */
    function handleSaveClient() {
      const name = document.getElementById('client-name').value.trim();
      let url = document.getElementById('client-url').value.trim();
      const key = document.getElementById('client-key').value.trim();
      const editIdx = parseInt(document.getElementById('edit-index').value);

      if (!name || !url) {
        alert('⚠️ Client Name and URL are mandatory!');
        return;
      }

      if (url.endsWith('/')) url = url.slice(0, -1);

      const clientData = {
        name,
        url,
        key,
        status: 'STANDBY',
        errorDetails: null,
        lastChecked: 'Initializing...',
        lastPurged: 'None'
      };

      if (editIdx > -1) {
        clients[editIdx] = { ...clients[editIdx], name, url, key };
      } else {
        clients.push(clientData);
      }

      saveState();
      cancelEdit();
      renderFleet();
      switchDashboard('view-clients');
    }

    function editClient(idx) {
      const c = clients[idx];
      document.getElementById('client-name').value = c.name;
      document.getElementById('client-url').value = c.url;
      document.getElementById('client-key').value = c.key || '';
      document.getElementById('edit-index').value = idx;

      document.getElementById('form-header').innerHTML = '<span>✏️</span> Edit Client Configuration';
      document.getElementById('btn-save').innerHTML = '<span>🔄</span> Update Configuration';
      document.getElementById('btn-cancel').style.display = 'inline-flex';
      switchDashboard('view-add');
    }

    function deleteClient(idx) {
      if (confirm(`⚠️ Stop and delete node ${clients[idx].name}?`)) {
        clients.splice(idx, 1);
        saveState();
        renderFleet();
      }
    }

    function cancelEdit() {
      document.getElementById('client-name').value = '';
      document.getElementById('client-url').value = '';
      document.getElementById('client-key').value = '';
      document.getElementById('edit-index').value = -1;
      document.getElementById('form-header').innerHTML = '<span>➕</span> Register New Firebase Database';
      document.getElementById('btn-save').innerHTML = '<span>💾</span> Store Client';
      document.getElementById('btn-cancel').style.display = 'none';
    }

    /* High-Frequency Parallel Core Check & Wipe */
    let isExecuting = false;

    async function checkAndWipeNode(c) {
      let endpoint = `${c.url}/.json`;
      if (c.key) endpoint += `?auth=${encodeURIComponent(c.key)}`;

      const timeNow = new Date().toLocaleTimeString('en-US', { hour12: false });
      c.lastChecked = timeNow;

      try {
        const response = await fetch(endpoint, { method: 'GET' });

        if (response.status === 401 || response.status === 403) {
          c.status = 'PERMISSION DENIED';
          c.errorDetails = `HTTP ${response.status}: Database Rules restricted read/write without valid Secret Token.`;
          return;
        }

        if (response.status === 404) {
          c.status = 'NOT FOUND';
          c.errorDetails = `HTTP 404: Invalid Firebase Endpoint or Database URL misconfigured.`;
          return;
        }

        if (!response.ok) {
          c.status = `ERR ${response.status}`;
          c.errorDetails = `HTTP query failed with status code ${response.status} (${response.statusText}).`;
          return;
        }

        // Rules are working normally
        const data = await response.json();
        c.errorDetails = null; // Clear previous error

        if (data !== null) {
          // Found incoming data -> Instant Wipe
          const delResponse = await fetch(endpoint, { method: 'DELETE' });
          if (delResponse.ok) {
            c.status = 'DATA PURGED';
            c.lastPurged = timeNow;
            totalPurges++;
            pushLog(timeNow, c.name, '🗑️ INSTANT ROOT PURGE COMPLETED', 'color: #00ff66;');
          } else {
            c.status = 'DELETE FAILED';
            c.errorDetails = `Failed to purge: HTTP ${delResponse.status}`;
          }
        } else {
          c.status = 'ACTIVE (IDLE)';
        }

      } catch (err) {
        c.status = 'NETWORK ERROR';
        c.errorDetails = 'Network failure or CORS policy blocked direct REST connection.';
      }
    }

    async function executionTick() {
      if (isExecuting || clients.length === 0) return;
      isExecuting = true;

      // Execute all database checks in parallel without sequential delay
      await Promise.allSettled(clients.map(c => checkAndWipeNode(c)));

      saveState();
      renderFleet();
      isExecuting = false;
    }

    function pushLog(time, name, msg, style) {
      logs.push({ time, name, msg, style });
      if (logs.length > 80) logs.shift();
      renderLogs();
    }

    function clearLogs() {
      logs = [];
      saveState();
      renderLogs();
    }

    /* Dynamic UI Rendering */
    function renderFleet() {
      document.getElementById('menu-client-count').innerText = clients.length;
      document.getElementById('nodes-count-display').innerText = clients.length;
      document.getElementById('metric-clients').innerText = clients.length;
      document.getElementById('metric-purges').innerText = totalPurges;

      let errorCount = 0;
      const container = document.getElementById('client-cards-container');

      if (clients.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem;">No database registered. Navigate to "Register Client".</div>';
        document.getElementById('metric-errors').innerText = 0;
        return;
      }

      container.innerHTML = clients.map((c, idx) => {
        let badgeClass = 'badge-ok';
        if (c.errorDetails || c.status.includes('DENIED') || c.status.includes('ERR')) {
          badgeClass = 'badge-err';
          errorCount++;
        } else if (c.status === 'STANDBY') {
          badgeClass = 'badge-wait';
        }

        return `
          <div class="client-node">
            <div class="client-header">
              <span class="client-name">📦 ${escapeHtml(c.name)}</span>
              <span class="badge ${badgeClass}">${c.status}</span>
            </div>
            
            <div class="detail-box">
              <div class="detail-row"><span>Endpoint:</span> <span class="detail-val">${escapeHtml(c.url)}</span></div>
              <div class="detail-row"><span>Auth Secret:</span> <span class="detail-val">${c.key ? '••••••' + c.key.slice(-4) : 'Public / None'}</span></div>
              <div class="detail-row"><span>Last Checked:</span> <span class="detail-val">${c.lastChecked}</span></div>
              <div class="detail-row"><span>Last Wipe:</span> <span class="detail-val" style="color:var(--accent-neon);">${c.lastPurged}</span></div>
            </div>

            ${c.errorDetails ? `
              <div class="error-console">
                <strong>⚠️ ERROR DIAGNOSTIC:</strong><br>
                ${escapeHtml(c.errorDetails)}
              </div>
            ` : ''}

            <div style="display:flex; gap:6px; margin-top:4px;">
              <button class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="editClient(${idx})">✏️ Edit</button>
              <button class="btn btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteClient(${idx})">🗑️ Delete</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('metric-errors').innerText = errorCount;
    }

    function renderLogs() {
      const feed = document.getElementById('terminal-feed');
      if (logs.length === 0) {
        feed.innerHTML = '<div style="color:var(--text-muted);">Terminal active. Listening to parallel client nodes...</div>';
        return;
      }

      feed.innerHTML = logs.slice(-35).reverse().map(l => `
        <div class="log-line">
          <span style="color: var(--accent-cyan);">[${l.time}]</span>
          <span style="color: #fff; font-weight:bold;">[${escapeHtml(l.name)}]</span>
          <span style="${l.style}">${escapeHtml(l.msg)}</span>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    /* Web Worker Background Engine (24/7 Loop) */
    // Browser worker bypasses background tab throttling
    const workerBlob = new Blob([`
      setInterval(() => {
        postMessage('tick');
      }, 1000);
    `], { type: 'application/javascript' });

    const backgroundWorker = new Worker(URL.createObjectURL(workerBlob));
    backgroundWorker.onmessage = () => {
      executionTick();
    };

    // Initialize UI
    renderFleet();
    renderLogs();
  </script>
</body>
</html>
